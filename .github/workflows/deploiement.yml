# Met le site en ligne sur AlwaysData (FTP chiffre) a chaque envoi sur la branche principale.
# Les identifiants FTP sont dans les "secrets" du depot GitHub, jamais dans le code.
# N'efface jamais rien sur le serveur et ne touche pas aux fichiers qui n'y existent que
# la-bas : config.php, uploads_*/ (PDF) et donnees/ (comptes et messages).
name: Mise en ligne sur AlwaysData

on:
  push:
    branches:
      - claude/recover-last-conversation-info-ttntx5
  workflow_dispatch:

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  deploiement:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier que les identifiants FTP sont configures
        id: secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "Secrets FTP absents : ajoute FTP_SERVER, FTP_USERNAME et FTP_PASSWORD dans Settings > Secrets and variables > Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recuperer le code
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Installer lftp
        if: steps.secrets.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp gere la reprise de session TLS exigee par le FTP d'AlwaysData sur le canal de donnees.
      # mirror --reverse sans --delete : envoie les fichiers, ne supprime jamais rien sur le serveur.
      - name: Envoyer les fichiers sur le serveur
        if: steps.secrets.outputs.ok == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 3;
            set net:timeout 30;
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\";
            mirror --reverse --verbose --no-perms --parallel=4 \
              -x '^\.git' \
              -x '^\.claude/' \
              -x '^config\.php$' \
              -x '^config\.example\.php$' \
              -x '^uploads_' \
              -x '^donnees/' \
              ./ /www/
          "

      # Controle apres mise en ligne : pages accessibles, pas d'erreur PHP, secrets non lisibles.
      - name: Verifier le site en ligne
        if: steps.secrets.outputs.ok == 'true'
        run: |
          SITE="https://mou.alwaysdata.net"
          echec=0
          for page in index.html documents.php cours.php tp.php contact.php inscription.php compte.php connexion.php; do
            code=$(curl -s -o page.html -w "%{http_code}" "$SITE/$page")
            if [ "$code" != "200" ]; then
              echo "::error::$page repond $code"; echec=1
            elif grep -qiE "Warning|Avertissement|Fatal error|Parse error" page.html; then
              echo "::error::$page affiche une erreur PHP"; grep -iE "Warning|Avertissement|Fatal error|Parse error" page.html | head -3; echec=1
            else
              echo "OK  $page"
            fi
          done
          if curl -s "$SITE/config.php" | grep -q "motDePasse"; then
            echo "::error::config.php est lisible depuis internet"; echec=1
          else
            echo "OK  config.php n'expose rien"
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/donnees/utilisateurs.json")
          if [ "$code" = "200" ]; then
            echo "::error::donnees/utilisateurs.json est lisible depuis internet"; echec=1
          else
            echo "OK  donnees/ protege (code $code)"
          fi
          rm -f page.html
          exit $echec
